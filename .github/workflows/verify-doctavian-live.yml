name: Verify Doctavian live smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-doctavian-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci

      - name: Create temporary RSA keypair
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/doctavian-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/doctavian-private.pem -pubout -outform DER | base64 -w0 > /tmp/doctavian-public.b64

      - name: Publish temporary public key
        uses: actions/upload-artifact@v4
        with:
          name: doctavian-live-public-key
          path: /tmp/doctavian-public.b64
          retention-days: 1

      - name: Receive encrypted one-run input
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 120); do
            git fetch -q origin main
            if git show origin/main:.github/doctavian-live-input.b64 > /tmp/doctavian-cipher.b64 2>/dev/null; then
              found=1
              break
            fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then
            echo 'Encrypted one-run input was not provided.' >&2
            exit 1
          fi
          base64 -d /tmp/doctavian-cipher.b64 > /tmp/doctavian-cipher.bin
          bytes=$(stat -c%s /tmp/doctavian-cipher.bin)
          if [ "$bytes" -eq 0 ] || [ $((bytes % 512)) -ne 0 ]; then
            echo 'Encrypted input has an invalid block size.' >&2
            exit 1
          fi
          : > .env.local
          blocks=$((bytes / 512))
          for index in $(seq 0 $((blocks - 1))); do
            dd if=/tmp/doctavian-cipher.bin of=/tmp/doctavian-block.bin bs=512 skip="$index" count=1 status=none
            openssl pkeyutl -decrypt -inkey /tmp/doctavian-private.pem -in /tmp/doctavian-block.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 >> .env.local
          done
          chmod 600 .env.local

      - name: Diagnose live Doctavian auth boundary
        shell: bash
        run: |
          node --env-file-if-exists=.env.local --experimental-strip-types --input-type=module <<'NODE'
          import { createDoctavianReleaseTemplate } from './apps/agent/src/providers/doctavian-template.ts';

          const required = (name) => {
            const value = process.env[name]?.trim();
            if (!value) throw new Error(`Missing ${name}.`);
            return value;
          };
          const baseUrl = (process.env.DOCTAVIAN_API_BASE_URL || 'https://demo.api.doctavian.com').replace(/\/+$/, '');
          const token = required('DOCTAVIAN_ACCESS_TOKEN');
          const apiKey = required('DOCTAVIAN_API_KEY');
          const authHeaders = {
            Authorization: `Bearer ${token}`,
            'X-Api-Key': apiKey,
            Accept: 'application/json',
          };

          async function safeSummary(label, response, { neverReadBody = false } = {}) {
            if (neverReadBody) {
              console.log(`${label}: HTTP ${response.status}; content-type=${response.headers.get('content-type') || 'unknown'}`);
              return;
            }
            const text = await response.text();
            let summary = '';
            try {
              const value = JSON.parse(text);
              const err = value?.error;
              summary = JSON.stringify({
                resultStatus: value?.result?.statusCode,
                resultMessage: value?.result?.message,
                errorStatus: err?.statusCode,
                errorMessage: err?.message,
                innerCodes: Array.isArray(err?.innerErrors) ? err.innerErrors.map((item) => item?.code).filter(Boolean) : [],
              });
            } catch {
              summary = text ? `non-json-body-length=${text.length}` : 'empty-body';
            }
            console.log(`${label}: HTTP ${response.status}; ${summary}`);
          }

          const limits = await fetch(`${baseUrl}/v1/common/limits/get`, {
            headers: authHeaders,
            signal: AbortSignal.timeout(30000),
          });
          await safeSummary('common limits with bearer + api key', limits);

          const serviceToken = await fetch(`${baseUrl}/v1/common/service/token`, {
            method: 'POST',
            headers: authHeaders,
            signal: AbortSignal.timeout(30000),
          });
          await safeSummary('service token issuance with bearer + api key', serviceToken, { neverReadBody: serviceToken.ok });

          const templateBytes = createDoctavianReleaseTemplate();
          async function upload(label, extraHeaders = {}) {
            const form = new FormData();
            form.append(
              'file',
              new Blob([templateBytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }),
              'veriremit-release-template.docx',
            );
            const response = await fetch(`${baseUrl}/v1/documents/template/upload`, {
              method: 'POST',
              headers: { ...authHeaders, ...extraHeaders },
              body: form,
              signal: AbortSignal.timeout(30000),
            });
            await safeSummary(label, response);
          }

          await upload('template upload exact Mission 1 headers');
          await upload('template upload plus X-Storage-Type', { 'X-Storage-Type': 'document-template' });
          NODE

      - name: Remove temporary material
        if: always()
        shell: bash
        run: rm -f .env.local /tmp/doctavian-private.pem /tmp/doctavian-public.b64 /tmp/doctavian-cipher.b64 /tmp/doctavian-cipher.bin /tmp/doctavian-block.bin
