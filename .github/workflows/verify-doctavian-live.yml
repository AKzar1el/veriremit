name: Verify Doctavian live smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-doctavian-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create temporary RSA keypair
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/doctavian-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/doctavian-private.pem -pubout -outform DER | base64 -w0 > /tmp/doctavian-public.b64

      - name: Publish temporary public key
        uses: actions/upload-artifact@v4
        with:
          name: doctavian-live-public-key
          path: /tmp/doctavian-public.b64
          retention-days: 1

      - name: Receive encrypted one-run input
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 120); do
            git fetch -q origin main
            if git show origin/main:.github/doctavian-live-input.b64 > /tmp/doctavian-cipher.b64 2>/dev/null; then
              found=1
              break
            fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then
            echo 'Encrypted one-run input was not provided.' >&2
            exit 1
          fi
          base64 -d /tmp/doctavian-cipher.b64 > /tmp/doctavian-cipher.bin
          bytes=$(stat -c%s /tmp/doctavian-cipher.bin)
          if [ "$bytes" -eq 0 ] || [ $((bytes % 512)) -ne 0 ]; then
            echo 'Encrypted input has an invalid block size.' >&2
            exit 1
          fi
          : > .env.local
          blocks=$((bytes / 512))
          for index in $(seq 0 $((blocks - 1))); do
            dd if=/tmp/doctavian-cipher.bin of=/tmp/doctavian-block.bin bs=512 skip="$index" count=1 status=none
            openssl pkeyutl -decrypt -inkey /tmp/doctavian-private.pem -in /tmp/doctavian-block.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 >> .env.local
          done
          chmod 600 .env.local

      - name: Probe Doctavian caller membership
        shell: bash
        run: |
          node --env-file-if-exists=.env.local --input-type=module <<'NODE'
          const token = process.env.DOCTAVIAN_ACCESS_TOKEN?.trim();
          if (!token) throw new Error('Missing DOCTAVIAN_ACCESS_TOKEN.');
          const baseUrl = (process.env.DOCTAVIAN_API_BASE_URL || 'https://demo.api.doctavian.com').replace(/\/+$/, '');

          async function probe(label, path, authenticated) {
            const response = await fetch(`${baseUrl}${path}`, {
              headers: authenticated
                ? { Accept: 'application/json', Authorization: `Bearer ${token}` }
                : { Accept: 'application/json' },
              signal: AbortSignal.timeout(30000),
            });
            const text = await response.text();
            let detail = '';
            try {
              const value = JSON.parse(text);
              const err = value?.error;
              const profile = value?.result?.data;
              detail = JSON.stringify({
                resultStatus: value?.result?.statusCode,
                resultMessage: value?.result?.message,
                profilePresent: Boolean(profile && typeof profile === 'object'),
                errorStatus: err?.statusCode,
                errorMessage: err?.message,
                innerCodes: Array.isArray(err?.innerErrors) ? err.innerErrors.map((item) => item?.code).filter(Boolean) : [],
              });
            } catch {
              detail = text ? `non-json-body-length=${text.length}` : 'empty-body';
            }
            console.log(`${label}: HTTP ${response.status}; ${detail}`);
          }

          await probe('public common status', '/v1/common/status', false);
          await probe('caller profile and membership', '/v1/common/user/get', true);
          NODE

      - name: Remove temporary material
        if: always()
        shell: bash
        run: rm -f .env.local /tmp/doctavian-private.pem /tmp/doctavian-public.b64 /tmp/doctavian-cipher.b64 /tmp/doctavian-cipher.bin /tmp/doctavian-block.bin
