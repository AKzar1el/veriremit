name: Doctavian Live Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/doctavian-live-smoke.yml'

permissions:
  contents: read

concurrency:
  group: doctavian-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOCTAVIAN_API_KEY: ${{ secrets.DOCTAVIAN_API_KEY }}
      DOCTAVIAN_ACCESS_TOKEN: ${{ secrets.DOCTAVIAN_ACCESS_TOKEN }}
      DOCTAVIAN_API_BASE_URL: https://demo.api.doctavian.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Verify required secrets are configured
        shell: bash
        run: |
          test -n "$DOCTAVIAN_API_KEY" || { echo 'Missing required GitHub Actions secret: DOCTAVIAN_API_KEY'; exit 1; }
          test -n "$DOCTAVIAN_ACCESS_TOKEN" || { echo 'Missing required GitHub Actions secret: DOCTAVIAN_ACCESS_TOKEN'; exit 1; }
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run canonical Doctavian live smoke
        run: npm run smoke:doctavian
