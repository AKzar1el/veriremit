name: Ephemeral Foxit eSign status verification

on:
  push:
    paths:
      - '.github/workflows/ephemeral-esign-status.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate one-time credential encryption key
        run: |
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/veriremit-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/veriremit-private.pem -pubout -outform DER | base64 -w0 > /tmp/veriremit-public.b64
      - name: Upload one-time public key
        uses: actions/upload-artifact@v4
        with:
          name: veriremit-esign-status-public-key
          path: /tmp/veriremit-public.b64
          if-no-files-found: error
          retention-days: 1
      - name: Wait for encrypted credentials
        run: |
          set -e
          found=0
          for attempt in $(seq 1 100); do
            git fetch -q origin main
            if git show origin/main:.github/live-smoke-secrets.b64 > /tmp/veriremit-cipher.b64 2>/dev/null; then
              found=1
              break
            fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then
            echo 'Encrypted credential blob was not provided in time.' >&2
            exit 1
          fi
          base64 -d /tmp/veriremit-cipher.b64 > /tmp/veriremit-cipher.bin
          openssl pkeyutl -decrypt -inkey /tmp/veriremit-private.pem -in /tmp/veriremit-cipher.bin -out .env.local -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 .env.local
      - name: Verify authoritative Foxit completion
        run: |
          node --env-file-if-exists=.env.local --input-type=module <<'NODE'
          const required = name => {
            const value = process.env[name]?.trim();
            if (!value) throw new Error(`Missing ${name}.`);
            return value;
          };
          const headers = {
            client_id: required('FOXIT_CLIENT_ID'),
            client_secret: required('FOXIT_CLIENT_SECRET'),
            Accept: 'application/json',
          };
          const date = new Date().toISOString().slice(0, 10);
          let match;
          let authoritativeStatus;
          for (const status of ['EXECUTED', 'PARTIALLY SIGNED', 'SHARED']) {
            const idsResponse = await fetch(`https://na1.fusion.foxit.com/esign/api/v1/folders/getAllFolderIdsByStatus?dateFrom=${date}&dateTo=${date}&status=${encodeURIComponent(status)}`, {
              headers,
              signal: AbortSignal.timeout(30000),
            });
            if (!idsResponse.ok) continue;
            const idsPayload = await idsResponse.json();
            const ids = Array.isArray(idsPayload?.allFolderIds) ? idsPayload.allFolderIds : [];
            for (const id of [...ids].reverse()) {
              const detailResponse = await fetch(`https://na1.fusion.foxit.com/esign/api/v1/folders/myfolder?folderId=${encodeURIComponent(String(id))}`, {
                headers,
                signal: AbortSignal.timeout(30000),
              });
              if (!detailResponse.ok) continue;
              const detail = await detailResponse.json();
              const folder = detail?.folder;
              if (typeof folder?.folderName === 'string' && folder.folderName.startsWith('VeriRemit developer smoke')) {
                match = Number(folder.folderId);
                authoritativeStatus = String(folder.folderStatus ?? status).toUpperCase();
                break;
              }
            }
            if (Number.isInteger(match)) break;
          }
          if (!Number.isInteger(match)) throw new Error('VeriRemit Foxit envelope was not found.');
          const historyResponse = await fetch(`https://na1.fusion.foxit.com/esign/api/v1/folders/viewActivityHistory?folderId=${encodeURIComponent(String(match))}`, {
            headers,
            signal: AbortSignal.timeout(30000),
          });
          if (!historyResponse.ok) throw new Error(`Foxit activity lookup failed with HTTP ${historyResponse.status}.`);
          const history = await historyResponse.json();
          const activities = Array.isArray(history?.details?.activities) ? history.details.activities : [];
          const signed = activities.some(item => /sign/i.test(String(item?.activity ?? item?.action ?? '')));
          const executed = authoritativeStatus === 'EXECUTED' || String(history?.details?.status ?? '').toUpperCase() === 'EXECUTED';
          console.log(`Foxit authoritative envelope status: ${authoritativeStatus}.`);
          console.log(`Foxit activity history confirms signer action: ${signed ? 'yes' : 'no'}.`);
          if (!executed || !signed) {
            console.error('Foxit envelope has not reached authoritative executed state with a recorded signer action.');
            process.exit(2);
          }
          console.log('Foxit authoritative human-signature round trip verified.');
          NODE
      - name: Destroy ephemeral credentials
        if: always()
        run: rm -f .env.local /tmp/veriremit-private.pem /tmp/veriremit-public.b64 /tmp/veriremit-cipher.b64 /tmp/veriremit-cipher.bin

