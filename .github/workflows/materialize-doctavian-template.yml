name: Materialize Doctavian template

on:
  push:
    branches:
      - fix/doctavian-native-template
    paths:
      - '.tmp/doctavian-template.b64.part*'
      - '.github/workflows/materialize-doctavian-template.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify canonical template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/doctavian
          cat .tmp/doctavian-template.b64.part* | base64 --decode > artifacts/doctavian/veriremit-release-template.docx
          echo '966587e0f2b759f7d79aa031ed88339b0a5b16ec4ec0058d5d3030b957ebca96  artifacts/doctavian/veriremit-release-template.docx' | sha256sum -c -
          unzip -t artifacts/doctavian/veriremit-release-template.docx
      - name: Commit materialized binary and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/doctavian/veriremit-release-template.docx
          git rm .tmp/doctavian-template.b64.part* .github/workflows/materialize-doctavian-template.yml
          git commit -m 'fix: track provider-native Doctavian template'
          git push origin HEAD:fix/doctavian-native-template
