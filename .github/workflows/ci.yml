name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install PDF verification dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Verify unit, integration, types, build, and secrets
        run: npm run verify
      - name: Install Chromium for fixture-mode E2E
        run: npx playwright install --with-deps chromium
      - name: Run fixture-mode browser E2E
        run: npm run test:e2e
        env:
          VERIREMIT_PROVIDER_MODE: fixture
      - name: Print Playwright failure context
        if: failure()
        run: |
          find test-results -name error-context.md -print -exec cat {} \; || true
      - name: Build agent container without sponsor secrets
        run: docker build -f Dockerfile.agent -t veriremit-agent:ci .

# Live Nutrient/Foxit provider smokes are intentionally manual. PR CI never receives sponsor credentials.
