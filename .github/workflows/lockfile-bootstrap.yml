name: Bootstrap npm lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package manifests were not modified
        run: git diff --exit-code -- package.json 'apps/*/package.json' 'packages/*/package.json' 'packages/integrations/*/package.json'
      - name: Commit only package-lock.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only)" = 'package-lock.json'
          git commit -m 'chore: lock npm dependencies'
          git push origin HEAD:main
