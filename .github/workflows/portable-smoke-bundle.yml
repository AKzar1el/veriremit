name: Portable smoke bundle

on:
  push:
    paths:
      - '.github/workflows/portable-smoke-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create portable bundle
        run: |
          tar -czf /tmp/veriremit-smoke-bundle.tgz \
            --exclude=.git \
            --exclude=test-results \
            --exclude=playwright-report \
            .
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: veriremit-smoke-bundle
          path: /tmp/veriremit-smoke-bundle.tgz
          if-no-files-found: error
          retention-days: 1
