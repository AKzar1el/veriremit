name: Ephemeral Foxit eSign verification

on:
  push:
    paths:
      - '.github/workflows/ephemeral-live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate one-time encryption key
        run: |
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/veriremit-live-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/veriremit-live-private.pem -pubout -outform DER \
            | base64 -w0 > /tmp/veriremit-live-public.b64
      - name: Upload one-time public key
        uses: actions/upload-artifact@v4
        with:
          name: veriremit-live-public-key
          path: /tmp/veriremit-live-public.b64
          if-no-files-found: error
          retention-days: 1
      - name: Wait for encrypted credentials
        run: |
          set -e
          found=0
          for attempt in $(seq 1 100); do
            git fetch -q origin main
            if git show origin/main:.github/live-smoke-secrets.b64 > /tmp/veriremit-live-cipher.b64 2>/dev/null; then
              found=1
              break
            fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then
            echo "Encrypted credential blob was not provided in time." >&2
            exit 1
          fi
          base64 -d /tmp/veriremit-live-cipher.b64 > /tmp/veriremit-live-cipher.bin
          openssl pkeyutl -decrypt \
            -inkey /tmp/veriremit-live-private.pem \
            -in /tmp/veriremit-live-cipher.bin \
            -out .env.local \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          chmod 600 .env.local
      - name: Prove activated Foxit eSign with draft-only request
        run: |
          node --env-file-if-exists=.env.local --input-type=module <<'NODE'
          const required = name => {
            const value = process.env[name]?.trim();
            if (!value) throw new Error(`Missing ${name}.`);
            return value;
          };
          const clientId = required('FOXIT_CLIENT_ID');
          const clientSecret = required('FOXIT_CLIENT_SECRET');
          const signer = required('VERIREMIT_SIGNER_EMAIL');
          const response = await fetch('https://na1.fusion.foxit.com/esign/api/v1/folders/createfolder', {
            method: 'POST',
            headers: {
              client_id: clientId,
              client_secret: clientSecret,
              'Content-Type': 'application/json',
              Accept: 'application/json',
            },
            body: JSON.stringify({
              folderName: 'VeriRemit activation verification',
              inputType: 'url',
              fileUrls: ['https://app.developer-api.foxit.com/esign/foxit-esign-api-sample.pdf'],
              fileNames: ['Foxit eSign sample.pdf'],
              parties: [{
                firstName: 'Tomi',
                lastName: 'Seregi',
                emailId: signer,
                permission: 'FILL_FIELDS_AND_SIGN',
                sequence: 1,
              }],
              processTextTags: false,
              processAcroFields: false,
              createEmbeddedSigningSession: false,
              sendNow: false,
            }),
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) {
            console.error(`Foxit draft verification failed with HTTP ${response.status}.`);
            process.exit(2);
          }
          console.log('Foxit eSign activation verified with a draft envelope.');
          NODE
      - name: Create real VeriRemit human-signature envelope
        run: npm run smoke:foxit:esign
      - name: Destroy ephemeral credentials
        if: always()
        run: |
          rm -f .env.local /tmp/veriremit-live-private.pem /tmp/veriremit-live-public.b64 \
            /tmp/veriremit-live-cipher.b64 /tmp/veriremit-live-cipher.bin

